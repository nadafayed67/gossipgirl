quiz:`<div class="modal-kicker">The quiz · your UES alter ego</div><h2 id="modalTitle">Who are you, really?</h2><p class="modal-intro">Choose the answer that feels most like you. No overthinking — your reputation is at stake.</p><div id="quizArea"><div class="quiz-question"><b>1. Your ideal Friday night?</b><div class="quiz-options">${[['blair','A perfectly planned dinner where everyone is dressed to impress.'],['serena','A spontaneous night that turns into a story.'],['dan','A bookshop, a great conversation, and people-watching.'],['jenny','Trying a new look and making something unforgettable.']].map(a=>`<button class="quiz-option" data-answer="${a[0]}">${a[1]}</button>`).join('')}</div></div><div class="quiz-question" style="margin-top:20px"><b>2. Your greatest strength?</b><div class="quiz-options">${[['blair','Strategy. I am always three steps ahead.'],['serena','Charm. People feel at ease around me.'],['dan','Observation. I notice what others miss.'],['jenny','Ambition. I make my own opportunities.']].map(a=>`<button class="quiz-option" data-answer="${a[0]}">${a[1]}</button>`).join('')}</div></div><div class="quiz-question" style="margin-top:20px"><b>3. Pick your signature accessory.</b><div class="quiz-options">${[['blair','A headband and a perfectly structured bag.'],['serena','A statement dress and effortless hair.'],['dan','A notebook full of thoughts.'],['jenny','A bold piece nobody else would dare wear.']].map(a=>`<button class="quiz-option" data-answer="${a[0]}">${a[1]}</button>`).join('')}</div></div><button class="primary" id="quizSubmit">REVEAL MY CHARACTER ♥</button><div class="result" id="quizResult"></div></div>`,
films:`<div class="modal-kicker">The film club · lucky dip</div><h2 id="modalTitle">Tonight's pick.</h2><p class="modal-intro">One random movie recommendation from the Y2K era and the Gossip Girl universe. Tap again when the credits roll.</p><div id="filmFeature"><p class="loading-note">Choosing your movie…</p></div><div class="feature-controls"><button id="nextFilm">PICK ANOTHER FILM ↻</button></div><p class="note">Poster images are sourced from Wikipedia where available. Availability varies by region and streaming service.</p>`,
blasts:`<div class="modal-kicker">Gossip Girl blasts · fictional inbox</div><h2 id="modalTitle">You have a message.</h2><p class="modal-intro">One blast at a time. Tap the button for another — because nobody needs four scandals at once.</p><div class="blast"><div class="sender">GOSSIP GIRL · NEW MESSAGE</div><p id="blastMessage">Spotted: someone said they were “staying in” and is now three blocks away from the party. Iconic.</p><small>JUST NOW · UPPER EAST SIDE</small></div><button class="primary" id="newBlast">NEXT BLAST ↻</button><p class="note">Fictional messages inspired by the show's anonymous-gossip format; not real updates about real people.</p>`,
archive:`<div class="modal-kicker">The archive · behind the scenes</div><h2 id="modalTitle">Off-camera, on record.</h2><p class="modal-intro">Candid set memories, behind-the-scenes stories, cast interviews, and off-camera moments. Tap through the scrapbook.</p><div id="archiveFeature"><p class="loading-note">Opening the archive…</p></div><div class="feature-controls"><button id="nextArchive">NEXT MEMORY ↻</button></div><p class="note">This scrapbook mixes reported filming memories with public cast interviews. Images are fetched from available public biography pages; follow the source links for original reporting and candid galleries.</p>`,
photobooth:`<div class="modal-kicker">The photo booth · say cheese, darling</div><h2 id="modalTitle">Caught on camera.</h2><p class="modal-intro">Make a little Y2K-style photo strip. Allow camera access, strike a pose, and save your keepsake.</p><div id="boothArea" class="photo-booth"><video id="boothVideo" autoplay playsinline style="width:100%;max-height:330px;object-fit:cover;border-radius:10px;background:#30202b"></video><div class="booth-actions"><button id="startBooth">TURN CAMERA ON</button><button id="snapBooth">TAKE PHOTO</button></div><div id="boothResult"></div><p class="note">Camera access works on HTTPS or localhost. Your photos stay in this browser session unless you download them.</p></div>`};
const backdrop=document.getElementById('modalBackdrop'), modalContent=document.getElementById('modalContent');function openModal(key){modalContent.innerHTML=content[key]||'';backdrop.classList.add('open');document.body.style.overflow='hidden';if(key==='quiz')initQuiz();if(key==='blasts')initBlasts();if(key==='magazine')initMagazine();if(key==='films')initFilms();if(key==='archive')initArchive();if(key==='books')initBooks();if(key==='photobooth')initPhotoBooth();}function closeModal(){backdrop.classList.remove('open');document.body.style.overflow='';}document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.open)));document.getElementById('closeModal').addEventListener('click',closeModal);backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

async function wikiSummary(page){try{const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(page.replaceAll(' ','_')),{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('no summary');return await r.json()}catch(e){return null}}
function pickDifferent(arr,last){let choices=arr.filter(x=>x.title!==last);return choices[Math.floor(Math.random()*choices.length)]||arr[0]}
let lastNews='',lastFilm='',lastCast='',lastBook='';
async function showNews(){const el=modalContent.querySelector('#magazineFeature');if(!el)return;const item=pickDifferent(eraStories,lastNews);lastNews=item.title;el.innerHTML='<p class="loading-note">Developing the story…</p>';const data=await wikiSummary(item.page);if(!el.isConnected)return;const img=data?.thumbnail?.source;el.innerHTML=`<div class="dynamic-feature">${img?`<img class="feature-photo landscape" src="${img}" alt="Image related to ${item.title}">`:'<div class="mag-cover"><div class="cover-name">SPOTTED!</div><p>THE YEAR IN CULTURE</p><small>'+item.year+'</small></div>'}<div class="feature-copy"><span class="tag">${item.tag} · ${item.year}</span><h3>${item.title}</h3><p>${item.context}</p><p class="note">${data?.description||'A moment from the 2000s.'}</p><a class="feature-controls" href="https://en.wikipedia.org/wiki/${encodeURIComponent(item.page.replaceAll(' ','_'))}" target="_blank" rel="noopener">READ BACKGROUND ↗</a></div></div>`}
function initMagazine(){showNews();modalContent.querySelector('#nextNews')?.addEventListener('click',showNews)}
async function showFilm(){const el=modalContent.querySelector('#filmFeature');if(!el)return;const item=pickDifferent(filmPicks,lastFilm);lastFilm=item.title;el.innerHTML='<p class="loading-note">Finding the poster…</p>';const data=await wikiSummary(item.page);if(!el.isConnected)return;const img=data?.thumbnail?.source;el.innerHTML=`<div class="dynamic-feature">${img?`<img class="feature-photo" src="${img}" alt="${item.title} poster or related image">`:'<div class="mag-cover"><div class="cover-name">FILM<br>CLUB</div><p>'+item.year+'</p></div>'}<div class="feature-copy"><span class="tag">${item.tag} · ${item.year}</span><h3>${item.title} (${item.year})</h3><p>${item.why}</p><p class="note">${data?.description||'A Y2K-era screen favorite.'}</p><a class="feature-controls" href="https://en.wikipedia.org/wiki/${encodeURIComponent(item.page.replaceAll(' ','_'))}" target="_blank" rel="noopener">FILM DETAILS ↗</a></div></div>`}

async function showArchive(){const el=modalContent.querySelector('#archiveFeature');if(!el)return;let pool=castArchive.filter(x=>x.person!==lastCast);const item=pool[Math.floor(Math.random()*pool.length)]||castArchive[0];lastCast=item.person;el.innerHTML='<p class="loading-note">Finding a cast portrait…</p>';const data=await wikiSummary(item.page);if(!el.isConnected)return;const img=data?.thumbnail?.source;el.innerHTML=`<div class="dynamic-feature">${img?`<img class="feature-photo" src="${img}" alt="${item.person}">`:'<div class="mag-cover"><div class="cover-name">GG</div><p>CAST ARCHIVE</p></div>'}<div class="feature-copy"><span class="tag">${item.tag} · REAL LIFE</span><h3>${item.person}</h3><p>${item.context}</p><p class="note">${data?.description||'Actor and cast member of Gossip Girl.'}</p><a class="feature-controls" href="https://en.wikipedia.org/wiki/${encodeURIComponent(item.page.replaceAll(' ','_'))}" target="_blank" rel="noopener">BIOGRAPHY ↗</a></div></div>`}

function initPhotoBooth(){const video=modalContent.querySelector('#boothVideo'),start=modalContent.querySelector('#startBooth'),snap=modalContent.querySelector('#snapBooth'),result=modalContent.querySelector('#boothResult');let stream;start.addEventListener('click',async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;start.textContent='CAMERA IS ON'}catch(e){result.innerHTML='<p class="note">Camera permission was not available. Open this HTML on HTTPS or localhost and allow camera access.</p>'}});snap.addEventListener('click',()=>{if(!video.videoWidth){result.innerHTML='<p class="note">Turn the camera on first, darling.</p>';return}const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;const ctx=c.getContext('2d');ctx.translate(c.width,0);ctx.scale(-1,1);ctx.filter='sepia(.18) saturate(1.15) contrast(1.04)';ctx.drawImage(video,0,0,c.width,c.height);const pad=22,footer=92,final=document.createElement('canvas');final.width=c.width+pad*2;final.height=c.height+pad*2+footer;const f=final.getContext('2d');f.fillStyle='#fff7f5';f.fillRect(0,0,final.width,final.height);f.fillStyle='#f7d9e5';f.fillRect(pad-7,pad-7,c.width+14,c.height+14);f.drawImage(c,pad,pad);f.fillStyle='#d72c7b';f.font='italic 30px Georgia';f.fillText('xoxo',pad+4,c.height+pad+43);f.font='bold 15px Georgia';f.fillText('GOSSIP GIRL',pad+4,c.height+pad+68);f.font='bold 22px Georgia';f.fillText('♥',final.width-pad-28,c.height+pad+55);/* lipstick-kiss stamp */f.save();f.translate(final.width-pad-54,pad+35);f.rotate(-.18);f.fillStyle='rgba(207,36,91,.72)';f.beginPath();f.moveTo(0,0);f.bezierCurveTo(-24,-22,-40,-3,-24,14);f.bezierCurveTo(-12,27,-2,35,0,39);f.bezierCurveTo(3,30,20,22,28,9);f.bezierCurveTo(41,-8,19,-22,0,0);f.fill();f.globalCompositeOperation='destination-out';f.beginPath();f.ellipse(0,9,12,4,-.1,0,Math.PI*2);f.fill();f.restore();f.fillStyle='rgba(215,44,123,.85)';f.font='italic 12px Georgia';f.fillText('SPOTTED',final.width-pad-82,final.height-10);const url=final.toDataURL('image/jpeg',.94);result.innerHTML=`<div class="booth-preview"><img src="${url}" alt="Your Gossip Girl photo booth portrait with logo, xoxo and lipstick kiss"></div><div class="booth-actions"><a download="gossip-girl-photo.jpg" href="${url}" style="display:inline-block;background:#d72c7b;color:white;padding:10px 14px;border-radius:20px;text-decoration:none;font-size:12px">SAVE YOUR PHOTO</a></div>`});}
function initQuiz(){const chosen={};modalContent.querySelectorAll('.quiz-question').forEach((q,i)=>q.querySelectorAll('.quiz-option').forEach(btn=>btn.addEventListener('click',()=>{q.querySelectorAll('.quiz-option').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');chosen[i]=btn.dataset.answer;})));modalContent.querySelector('#quizSubmit').addEventListener('click',()=>{if(Object.keys(chosen).length<3){alert('Answer all three, darling. Your story deserves a proper ending.');return;}const counts={blair:0,serena:0,dan:0,jenny:0};Object.values(chosen).forEach(x=>counts[x]++);const winner=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];const results={blair:['Blair Waldorf','Ambitious, strategic, stylish, and fiercely loyal. You know what you want — and you have a plan to get it.'],serena:['Serena van der Woodsen','Magnetic, spontaneous, and impossible to ignore. You lead with your heart and make every entrance memorable.'],dan:['Dan Humphrey','Observant, thoughtful, and quietly witty. You notice the story beneath the story — and you have a lot to say about it.'],jenny:['Jenny Humphrey','Creative, bold, and determined to define yourself. You are not waiting for permission to become who you want to be.']};const r=results[winner];const el=modalContent.querySelector('#quizResult');el.style.display='block';el.innerHTML='<strong>YOUR RESULT: '+r[0]+'</strong><br>'+r[1];el.scrollIntoView({behavior:'smooth',block:'nearest'});});}
const blastMessages=['Spotted: someone has been practicing their “casual” run-in all afternoon. Subtle, darling.','A little bird says the group chat is busier than the party itself. Put the phone down. Or don’t.','Tonight’s dress code? Main character energy. Attendance is optional; an entrance is not.','Rumor has it someone has a secret. Breaking news: everyone does.'];function initBlasts(){modalContent.querySelector('#newBlast').addEventListener('click',()=>{const p=modalContent.querySelector('#blastMessage');let pool=blastMessages.filter(x=>x!==p.textContent);p.textContent=pool[Math.floor(Math.random()*pool.length)]||blastMessages[0];});}
